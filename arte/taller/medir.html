<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medir modelo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1e24; color: #ddd; font: 12px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #t { position: fixed; top: 4px; left: 6px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="t"></div>
<script type="module">
// Vista de frente (izquierda) y de lado (derecha), ortográficas, con una rejilla en las unidades del modelo
// (cada línea `?paso=`, por defecto 10; las gruesas cada 5). ?m=ruta del .glb relativa a la raíz del proyecto.
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

const q = new URLSearchParams(location.search)
const step = Number(q.get('paso')) || 10
const gltf = await new GLTFLoader().loadAsync('../../' + q.get('m'))
const model = gltf.scene
model.updateMatrixWorld(true)
const box = new THREE.Box3().setFromObject(model)
const size = box.getSize(new THREE.Vector3())
document.getElementById('t').textContent = `x ${box.min.x.toFixed(1)}…${box.max.x.toFixed(1)} · y ${box.min.y.toFixed(1)}…${box.max.y.toFixed(1)} · z ${box.min.z.toFixed(1)}…${box.max.z.toFixed(1)} · rejilla ${step}`

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(devicePixelRatio)
renderer.setScissorTest(true)
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.add(new THREE.HemisphereLight('#ffffff', '#555555', 2.5))
scene.add(model)

/** Rejilla en un plano: `a` y `b` son los ejes (0 x, 1 y, 2 z) que recorre. */
function grid(a, b) {
  const pts = [], strong = []
  const lo = [box.min.x, box.min.y, box.min.z].map((v) => Math.floor(v / step) * step - step)
  const hi = [box.max.x, box.max.y, box.max.z].map((v) => Math.ceil(v / step) * step + step)
  for (const [axis, other] of [[a, b], [b, a]]) for (let v = lo[axis]; v <= hi[axis]; v += step) {
    const p = [0, 0, 0], r = [0, 0, 0]
    p[axis] = r[axis] = v
    p[other] = lo[other]; r[other] = hi[other]
    ;(Math.round(v / step) % 5 === 0 ? strong : pts).push(new THREE.Vector3(...p), new THREE.Vector3(...r))
  }
  const g = new THREE.Group()
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: '#3a4250', depthTest: false })))
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(strong), new THREE.LineBasicMaterial({ color: '#7a8496', depthTest: false })))
  g.renderOrder = 10
  return g
}
const front = grid(0, 1), side = grid(2, 1)
scene.add(front, side)

const span = Math.max(size.x, size.y, size.z) * 0.6
const center = box.getCenter(new THREE.Vector3())
const cam = () => new THREE.OrthographicCamera(-span, span, span, -span, -1e5, 1e5)
const camFront = cam(), camSide = cam()
camFront.position.set(center.x, center.y, center.z + 1000); camFront.lookAt(center)
camSide.position.set(center.x + 1000, center.y, center.z); camSide.lookAt(center)

function draw() {
  const w = innerWidth, h = innerHeight
  renderer.setSize(w, h)
  for (const [c, x, show] of [[camFront, 0, front], [camSide, w / 2, side]]) {
    const aspect = (w / 2) / h
    c.left = -span * aspect; c.right = span * aspect; c.updateProjectionMatrix()
    front.visible = show === front; side.visible = show === side
    renderer.setViewport(x, 0, w / 2, h); renderer.setScissor(x, 0, w / 2, h)
    renderer.render(scene, c)
  }
}
addEventListener('resize', draw)
draw()
window.ready = true
</script>
</body>
</html>
